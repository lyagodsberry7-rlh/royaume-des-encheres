name: royaume_des_encheres
description: Plateforme d'enchères moderne pour Dakar et le Sénégal.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.14.2

  # Images
  image_picker: ^1.1.2
  image: ^4.5.4
  cached_network_image: ^3.4.1

  # State management
  flutter_riverpod: ^3.0.3

  provider: ^6.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.5.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/royalis_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/